<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css" />
    <title>Census Survey</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Census Survey">
<meta property="og:description" content="Census Survey Form">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Envelope Screen -->
    <div id="envelope-container">
        <img src="envelope.png" alt="Envelope" id="envelope" />
        <p><span class="highlight">♡Letter for you♡</span></p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
        <div class="letter-window">

            <h1 id="letter-title">Suha will you be my Valentine?</h1>

            <img src="balbasaur2.gif" class="balbasaur" id="letter-balbasaur" />

            <div class="buttons" id="letter-buttons">

                <img src="yes.png" class="btn yes-btn" alt="Yes" />

                <div class="no-wrapper">
                    <img src="no.png" class="btn no-btn" alt="No" />
                </div>

            </div>

            <p id="final-text" class="final-text" style="display: none">
                <strong>Message;</strong>
                OMG! I knew you'd choose YES, how kind😊.
            </p>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
